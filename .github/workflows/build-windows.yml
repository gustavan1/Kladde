name: Build Kladde installers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish these installers as a prerelease
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            extension: exe
          - platform: Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
            extension: dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - if: runner.os == 'macOS'
        run: bash scripts/prepare-mac.sh
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - name: Verify the Mac bundle and its subscription connectors
        if: runner.os == 'macOS'
        shell: bash
        run: |
          root=src-tauri/target/aarch64-apple-darwin/release/bundle
          app="$root/macos/Kladde.app"
          codesign --verify --deep --strict "$app"
          hdiutil verify "$root"/dmg/*.dmg
          exe="$app/Contents/MacOS/kladde"
          lipo -verify_arch arm64 "$exe"
          export KLADDE_TEST_CODEX="$PWD/$app/Contents/MacOS/kladde-codex"
          "$KLADDE_TEST_CODEX" --version
          cargo test --locked --manifest-path src-tauri/Cargo.toml bundled_server_starts_without_credentials -- --ignored
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | "$exe" --kladde-mcp "$RUNNER_TEMP" | jq -e '.result.tools | map(.name) == ["read_shared_item","suggest_draft"]'
      - uses: actions/upload-artifact@v4
        with:
          name: Kladde-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/*.${{ matrix.extension }}
          if-no-files-found: error

  release:
    needs: build
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.publish_preview)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Kladde-*
          merge-multiple: true
          path: installers
      - name: Publish both downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_PREVIEW: ${{ inputs.publish_preview }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          flags=()
          if [[ "$PUBLISH_PREVIEW" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "kladde-build-$BUILD_NUMBER" "${flags[@]}" installers/*.exe installers/*.dmg \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Kladde (build $BUILD_NUMBER)" \
            --notes "Choose the .exe for Windows x64 or the .dmg for an Apple Silicon Mac."
