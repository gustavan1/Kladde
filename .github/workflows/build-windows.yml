name: Build Windows installer

# Runs on every push to main, and can be started by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to create the GitHub Release with the installer

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend packages
        run: npm ci

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build installer and publish it as a release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: kladde-v__VERSION__-build${{ github.run_number }}
          releaseName: "Kladde __VERSION__ (build ${{ github.run_number }})"
          releaseBody: |
            Windows installer for Kladde, built from commit ${{ github.sha }}.

            Download **Kladde_*_x64-setup.exe** under *Assets* below and double-click it to install.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
