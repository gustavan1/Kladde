name: Build Kladde installers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish these installers as a prerelease
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            extension: exe
          - platform: Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
            extension: dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Give this build its own version (1.3.<build number>) so the updater can tell it is newer
        shell: bash
        run: |
          node -e '
            const fs = require("fs"), p = "src-tauri/tauri.conf.json", c = JSON.parse(fs.readFileSync(p));
            c.version = c.version.split(".").slice(0, 2).join(".") + "." + process.env.GITHUB_RUN_NUMBER;
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
            console.log("Version", c.version);'
      - if: runner.os == 'macOS'
        run: bash scripts/prepare-mac.sh
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          # Without the signing key (e.g. a pull request from a fork) build without update files.
          extra=()
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then extra=(--config '{"bundle":{"createUpdaterArtifacts":false}}'); fi
          npm run tauri -- build --target ${{ matrix.target }} --bundles nsis "${extra[@]}"
      - name: Build the disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -o pipefail
          extra=()
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then extra=(--config '{"bundle":{"createUpdaterArtifacts":false}}'); fi
          for attempt in 1 2 3; do
            if npm run tauri -- build --target aarch64-apple-darwin --bundles app,dmg "${extra[@]}" 2>&1 | tee "$RUNNER_TEMP/kladde-bundle.log"; then
              break
            fi
            if [[ "$attempt" == 3 ]] || ! grep -q 'hdiutil: create failed - Resource busy' "$RUNNER_TEMP/kladde-bundle.log"; then
              exit 1
            fi
            sleep 5
          done
      - name: Verify the Mac bundle and its subscription connectors
        if: runner.os == 'macOS'
        shell: bash
        run: |
          root=src-tauri/target/aarch64-apple-darwin/release/bundle
          image=("$root"/dmg/*.dmg)
          hdiutil verify "${image[0]}"
          mount=$(mktemp -d "$RUNNER_TEMP/kladde-image.XXXXXX")
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "${image[0]}"
          trap 'hdiutil detach "$mount"' EXIT
          app="$mount/Kladde.app"
          codesign --verify --deep --strict "$app"
          exe="$app/Contents/MacOS/kladde"
          lipo "$exe" -verify_arch arm64
          export KLADDE_TEST_CODEX="$app/Contents/MacOS/kladde-codex"
          "$KLADDE_TEST_CODEX" --version
          cargo test --locked --manifest-path src-tauri/Cargo.toml bundled_server_starts_without_credentials -- --ignored
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | "$exe" --kladde-mcp "$RUNNER_TEMP" | jq -e '.result.tools | map(.name) == ["read_shared_item","suggest_draft"]'
      - name: Collect the installer and its update files
        shell: bash
        run: |
          root=src-tauri/target/${{ matrix.target }}/release/bundle
          mkdir -p out
          cp "$root"/${{ matrix.bundle }}/*.${{ matrix.extension }} out/
          # Signed update files: the setup .exe + .sig on Windows, Kladde.app.tar.gz + .sig on Mac.
          shopt -s nullglob
          for f in "$root"/nsis/*.exe.sig "$root"/macos/*.app.tar.gz "$root"/macos/*.app.tar.gz.sig; do cp "$f" out/; done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Kladde-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.publish_preview)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Kladde-*
          merge-multiple: true
          path: installers
      - name: Write latest.json for the in-app updater
        env:
          REPO: ${{ github.repository }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cd installers
          exe=$(ls *_x64-setup.exe)
          version=$(echo "$exe" | sed -E 's/^Kladde_(.+)_x64-setup\.exe$/\1/')
          base="https://github.com/$REPO/releases/download/kladde-build-$BUILD_NUMBER"
          # Spaces in file names become dots in GitHub release asset names; none here.
          jq -n --arg v "$version" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "Kladde $version – se https://github.com/$REPO/releases" \
            --arg win_sig "$(cat "$exe.sig")" --arg win_url "$base/$exe" \
            --arg mac_sig "$(cat Kladde.app.tar.gz.sig)" --arg mac_url "$base/Kladde.app.tar.gz" \
            '{version: $v, notes: $notes, pub_date: $date, platforms: {
               "windows-x86_64": {signature: $win_sig, url: $win_url},
               "darwin-aarch64": {signature: $mac_sig, url: $mac_url}}}' > latest.json
          cat latest.json
      - name: Publish both downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_PREVIEW: ${{ inputs.publish_preview }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          # Previews are prereleases, so installed apps keep following the latest normal release.
          flags=(--latest)
          if [[ "$PUBLISH_PREVIEW" == "true" ]]; then flags=(--prerelease --latest=false); fi
          gh release create "kladde-build-$BUILD_NUMBER" "${flags[@]}" installers/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Kladde (build $BUILD_NUMBER)" \
            --notes "Choose the .exe for Windows x64 or the .dmg for an Apple Silicon Mac. Installed copies of Kladde 1.3 or newer update themselves."
