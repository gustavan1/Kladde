name: Build Kladde installers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish these installers as a prerelease
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            extension: exe
          - platform: Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
            extension: dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Give this build its own version (1.3.<build number>) so the updater can tell it is newer
        shell: bash
        run: |
          node -e '
            const fs = require("fs"), p = "src-tauri/tauri.conf.json", c = JSON.parse(fs.readFileSync(p));
            c.version = c.version.split(".").slice(0, 2).join(".") + "." + process.env.GITHUB_RUN_NUMBER;
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
            console.log("Version", c.version);'
      - if: runner.os == 'macOS'
        run: bash scripts/prepare-mac.sh
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Exercise the school window and note subjects in the desktop app
        run: npm run test:desktop
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Build the disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if npm run tauri -- build --target aarch64-apple-darwin --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":false}}' 2>&1 | tee "$RUNNER_TEMP/kladde-bundle.log"; then
              break
            fi
            if [[ "$attempt" == 3 ]] || ! grep -q 'hdiutil: create failed - Resource busy' "$RUNNER_TEMP/kladde-bundle.log"; then
              exit 1
            fi
            sleep 5
          done
      - name: Verify the Mac bundle and its subscription connectors
        if: runner.os == 'macOS'
        shell: bash
        run: |
          root=src-tauri/target/aarch64-apple-darwin/release/bundle
          image=("$root"/dmg/*.dmg)
          hdiutil verify "${image[0]}"
          mount=$(mktemp -d "$RUNNER_TEMP/kladde-image.XXXXXX")
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "${image[0]}"
          trap 'hdiutil detach "$mount"' EXIT
          app="$mount/Kladde.app"
          codesign --verify --deep --strict "$app"
          exe="$app/Contents/MacOS/kladde"
          lipo "$exe" -verify_arch arm64
          swift scripts/test-mac-launch.swift "$exe" "$RUNNER_TEMP/kladde-launch-data"
          export KLADDE_TEST_CODEX="$app/Contents/MacOS/kladde-codex"
          "$KLADDE_TEST_CODEX" --version
          cargo test --locked --manifest-path src-tauri/Cargo.toml bundled_server_starts_without_credentials -- --ignored
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | "$exe" --kladde-mcp "$RUNNER_TEMP" | jq -e '.result.tools | map(.name) == ["read_shared_item","suggest_draft"]'
      - name: Collect the installer and its update files
        shell: bash
        run: |
          root=src-tauri/target/${{ matrix.target }}/release/bundle
          mkdir -p out
          cp "$root"/${{ matrix.bundle }}/*.${{ matrix.extension }} out/
          if [[ "$RUNNER_OS" == macOS ]]; then
            COPYFILE_DISABLE=1 tar -czf out/Kladde.app.tar.gz -C "$root/macos" Kladde.app
          fi
          ls -la out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Kladde-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  security:
    name: Check dependencies for known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: npm packages (fails on known vulnerabilities)
        run: npm audit --audit-level=low
      - name: Rust crates (fails on known vulnerabilities, RustSec database)
        run: |
          cargo install cargo-audit --locked --quiet
          # Fails on vulnerabilities; "unmaintained" and "unsound" notices are shown as warnings.
          cargo audit --file src-tauri/Cargo.lock

  release:
    needs: [build, security]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_preview))
    environment: release-signing
    concurrency:
      group: kladde-publish-${{ github.event_name == 'push' && 'stable' || github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # signs the build attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Kladde-*
          merge-multiple: true
          path: installers
      # No project checkout, lifecycle scripts, or build caches in this job.
      - name: Prepare the pinned standalone Tauri signer
        run: |
          set -euo pipefail
          scope="$RUNNER_TEMP/kladde-signer/node_modules/@tauri-apps"
          prepare() {
            local package="$1" digest="$2"
            local archive="$RUNNER_TEMP/$package.tgz"
            curl --fail --silent --show-error --location "https://registry.npmjs.org/@tauri-apps/$package/-/$package-2.12.5.tgz" -o "$archive"
            [[ "$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)" == "$digest" ]]
            mkdir -p "$scope/$package"
            tar -xzf "$archive" -C "$scope/$package" --strip-components=1
          }
          prepare cli 'Dm8s/4aiE52HsBh+Gz3uSrh+fEykRICA1VoAnQA80IqHoTRncPg+q4rGvuhmyNsHUPg3QrPjUrTUSfWmXLVVEw=='
          prepare cli-linux-x64-gnu 'OIun574QsULxaZ5SmPDX4D8bO95RBmYJshu8yGFy0RSyCMKEs/y+o3BThot4fbCv4ttC1Tq6Hzt0QRHXCIgp7w=='
      - name: Load the updater public key from the reviewed revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get install --yes minisign
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/src-tauri/tauri.conf.json?ref=$GITHUB_SHA" |
            jq -er '.plugins.updater.pubkey' | base64 --decode > "$RUNNER_TEMP/kladde-update.pub"
      - name: Sign tested build artifacts
        env:
          # Only the key in the main-only release-signing environment signs releases.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.KLADDE_UPDATE_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.KLADDE_UPDATE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${TAURI_SIGNING_PRIVATE_KEY:?No signing key: add KLADDE_UPDATE_SIGNING_KEY to the release-signing environment}"
          shopt -s nullglob
          exe=(installers/Kladde_*_x64-setup.exe)
          [[ ${#exe[@]} == 1 && "${exe[0]}" =~ ^installers/Kladde_([0-9]+\.[0-9]+\.[0-9]+)_x64-setup\.exe$ ]]
          version="${BASH_REMATCH[1]}"
          for file in "${exe[0]}" installers/Kladde.app.tar.gz; do
            test -s "$file"
            node "$RUNNER_TEMP/kladde-signer/node_modules/@tauri-apps/cli/tauri.js" signer sign --app-version "$version" "$file"
            test -s "$file.sig"
          done
      - name: Verify both signatures with the key trusted by installed copies
        run: |
          set -euo pipefail
          for file in installers/*_x64-setup.exe installers/Kladde.app.tar.gz; do
            base64 --decode "$file.sig" > "$RUNNER_TEMP/kladde-artifact.minisig"
            minisign -Vm "$file" -p "$RUNNER_TEMP/kladde-update.pub" -x "$RUNNER_TEMP/kladde-artifact.minisig"
          done
      - name: Write latest.json for the in-app updater
        env:
          REPO: ${{ github.repository }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cd installers
          exe=$(ls *_x64-setup.exe)
          test -s "$exe.sig"
          test -s Kladde.app.tar.gz.sig
          version=$(echo "$exe" | sed -E 's/^Kladde_(.+)_x64-setup\.exe$/\1/')
          base="https://github.com/$REPO/releases/download/kladde-build-$BUILD_NUMBER"
          # Spaces in file names become dots in GitHub release asset names; none here.
          jq -n --arg v "$version" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "Kladde $version – se https://github.com/$REPO/releases" \
            --arg win_sig "$(cat "$exe.sig")" --arg win_url "$base/$exe" \
            --arg mac_sig "$(cat Kladde.app.tar.gz.sig)" --arg mac_url "$base/Kladde.app.tar.gz" \
            '{version: $v, notes: $notes, pub_date: $date, platforms: {
               "windows-x86_64": {signature: $win_sig, url: $win_url},
               "darwin-aarch64": {signature: $mac_sig, url: $mac_url}}}' > latest.json
          cat latest.json
      - name: Checksums and a signed record of where the installers were built
        run: |
          cd installers
          sha256sum *.exe *.dmg Kladde.app.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            installers/*.exe
            installers/*.dmg
            installers/Kladde.app.tar.gz
      - name: Publish both downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_PREVIEW: ${{ inputs.publish_preview }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          # Previews are prereleases, so installed apps keep following the latest normal release.
          flags=(--latest)
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            if [[ "$tip" != "$GITHUB_SHA" ]]; then
              echo "A newer main revision exists. Skipping promotion."
              exit 0
            fi
          fi
          if [[ "$PUBLISH_PREVIEW" == "true" ]]; then flags=(--prerelease --latest=false); fi
          gh release create "kladde-build-$BUILD_NUMBER" "${flags[@]}" installers/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Kladde (build $BUILD_NUMBER)" \
            --notes "Choose the .exe for Windows x64 or the .dmg for an Apple Silicon Mac. Installed copies of Kladde 1.3 or newer update themselves."
